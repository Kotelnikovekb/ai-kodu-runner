[package]
name = "ai-codu-runer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["KotelnikoffDev <kotelnikoff.dev@gmail.com>"]


[dependencies]
anyhow = "1"
async-trait = "0.1"
bollard = "0.18"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
url = "2"

[dev-dependencies]
assert_matches = "1"
