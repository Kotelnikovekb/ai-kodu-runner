[package]
name = "ai-kodu-runner-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["KotelnikoffDev <kotelnikoff.dev@gmail.com>"]
description = "Shared lifecycle, workspace, policy and executor contracts for AI Kodu Runner"
repository = "https://github.com/Kotelnikovekb/ai-kodu-runner"
homepage = "https://github.com/Kotelnikovekb/ai-kodu-runner"
readme = "README.md"
keywords = ["runner", "workspace", "sandbox", "ci"]
categories = ["development-tools", "filesystem"]

[lib]
name = "runner_core"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
runner-protocol = { package = "ai-kodu-runner-protocol", path = "../runner-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "process", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
walkdir = "2"
