name: Build tool images

on:
  push:
    branches: [main, master]
    paths:
      - 'tool-images/**'
      - '.github/workflows/tool-images.yml'
  pull_request:
    paths:
      - 'tool-images/**'
      - '.github/workflows/tool-images.yml'

permissions:
  contents: read
  actions: write

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'kotelnikoffdev' }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flutter-opencode
            dockerfile: images/flutter-opencode.Dockerfile
          - image: nextjs-opencode
            dockerfile: images/nextjs-opencode.Dockerfile
          - image: python-opencode
            dockerfile: images/python-opencode.Dockerfile
          - image: universal-opencode
            dockerfile: images/universal-opencode.Dockerfile
          - image: php-opencode
            dockerfile: images/php-opencode.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          install: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./tool-images
          file: ./tool-images/${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  sbom-and-license-scan:
    name: SBOM and license scan ${{ matrix.image }}
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - flutter-opencode
          - nextjs-opencode
          - python-opencode
          - universal-opencode
          - php-opencode
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image to the GitHub runner Docker daemon
        env:
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
        run: docker pull --platform linux/amd64 "$IMAGE"

      - name: Generate SBOM and scan licenses
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.json
          scanners: vuln,license
          ignore-unfixed: true

      - name: Scan image vulnerabilities and licenses
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          format: table
          scanners: vuln
          vuln-type: os
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Verify image reference
        env:
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
        run: |
          case "$IMAGE" in
            /*) echo "Invalid image reference: $IMAGE" >&2; exit 1 ;;
          esac
          test -n "${IMAGE%%/*}" || {
            echo "Image reference has no registry namespace: $IMAGE" >&2
            exit 1
          }

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.json
          if-no-files-found: error
