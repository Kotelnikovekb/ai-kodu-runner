stages:
  - lint
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  BUILDX_BUILDER: ci-builder

dockerfile-lint:
  stage: lint
  image: hadolint/hadolint:latest-debian
  script:
    - hadolint --failure-threshold error images/flutter-opencode.Dockerfile
    - hadolint --failure-threshold error images/nextjs-opencode.Dockerfile
    - hadolint --failure-threshold error images/python-opencode.Dockerfile
    - hadolint --failure-threshold error images/universal-opencode.Dockerfile
    - hadolint --failure-threshold error images/php-opencode.Dockerfile

.build-and-push:
  stage: build
  image: docker:28.3.3-cli
  services:
    - name: docker:28.3.3-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
    - until docker info; do sleep 1; done
    - docker buildx create --driver docker-container --name "$BUILDX_BUILDER" --use tcp://docker:2375
  script:
    - export IMAGE="$DOCKERHUB_USERNAME/$IMAGE_NAME"
    - export TAG_SHA="$IMAGE:$CI_COMMIT_SHORT_SHA"
    - export TAG_REF="$IMAGE:$CI_COMMIT_REF_SLUG"
    - export TAG_LATEST="$IMAGE:latest"
    - |
      TAG_ARGS="--tag $TAG_SHA --tag $TAG_REF"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAG_ARGS="$TAG_ARGS --tag $TAG_LATEST"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAG_ARGS="$TAG_ARGS --tag $IMAGE:$CI_COMMIT_TAG"
      fi
      docker buildx build \
        --file "$DOCKERFILE" \
        --platform linux/amd64,linux/arm64 \
        $TAG_ARGS \
        --cache-from type=registry,ref="$IMAGE:buildcache" \
        --cache-to type=registry,ref="$IMAGE:buildcache",mode=max \
        --push .
  after_script:
    - docker logout || true

build-flutter:
  extends: .build-and-push
  variables:
    IMAGE_NAME: flutter-opencode
    DOCKERFILE: images/flutter-opencode.Dockerfile
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [images/flutter-opencode.Dockerfile]
    - if: '$CI_COMMIT_TAG'
      changes: [images/flutter-opencode.Dockerfile]
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: [images/flutter-opencode.Dockerfile]

build-nextjs:
  extends: .build-and-push
  variables:
    IMAGE_NAME: nextjs-opencode
    DOCKERFILE: images/nextjs-opencode.Dockerfile
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [images/nextjs-opencode.Dockerfile]
    - if: '$CI_COMMIT_TAG'
