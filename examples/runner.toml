server_url = "https://runner-api.example.com"
runner_token = "env:OMNIROUTE_RUNNER_TOKEN"
name = "developer-machine"
work_dir = "/absolute/path/to/ai-codu-runer"
concurrency = 1

[docker]
host = "auto"
pull_policy = "if-not-present"

[limits]
max_cpu = 4.0
max_memory_mb = 8192
max_pids = 512
max_timeout_seconds = 3600
max_log_bytes = 52428800
max_artifact_bytes = 524288000
max_artifact_files = 10000

[security]
allow_network = true
allow_privileged = false
allow_host_mounts = false
allowed_environment = ["OPENCODE_API_KEY", "OPENCODE_BASE_URL", "OPENCODE_MODEL", "OPENAI_API_KEY", "ANTHROPIC_API_KEY", "OMNIROUTE_MCP_KEY", "OMNIROUTE_API_KEY", "OMNIROUTE_BASE_URL", "FREEMODEL_API_KEY", "FREEMODEL_BASE_URL"]

# These checks are appended to every workflow and cannot be disabled by a job.
# The executables must be present in the job image.
mandatory_verifiers = [
  { command = ["trivy", "fs", "--scanners", "secret", "--exit-code", "1", "."] },
  { command = ["trivy", "fs", "--scanners", "vuln", "--exit-code", "1", "."] }
]
